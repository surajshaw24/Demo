<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro - Advanced Predictor</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --gray: #64748b;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background: var(--darker);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        .game-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 1.5rem;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .game-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            z-index: -1;
            animation: pulse 15s infinite alternate;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.1; }
            100% { transform: scale(1.2); opacity: 0.2; }
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        
        .game-stats {
            display: flex;
            gap: 1rem;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .game-area {
            position: relative;
            height: 220px;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .flight-path {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateY(-50%);
        }
        
        .airplane {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%) rotate(0deg);
            width: 70px;
            height: 70px;
            transition: left 0.05s linear;
            z-index: 10;
            filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5));
            transform-origin: center center;
        }
        
        .multiplier-display {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--secondary);
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .crash-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(transparent, var(--danger), transparent);
            display: none;
            z-index: 5;
        }
        
        .crash-line::after {
            content: 'CRASH';
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--danger);
            font-weight: 700;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0;
            animation: cloudFade 15s infinite;
        }
        
        @keyframes cloudFade {
            0%, 100% { opacity: 0; transform: translateX(-20px); }
            10%, 90% { opacity: 0.1; }
            50% { opacity: 0.2; transform: translateX(20px); }
        }
        
        .prediction-area {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }
        
        .prediction-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            align-items: center;
        }
        
        .ai-badge {
            background: linear-gradient(to right, var(--primary), #8b5cf6);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 0.5rem;
            animation: pulse 2s infinite;
        }
        
        .prediction-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }
        
        .prediction-card {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.15), rgba(30, 64, 175, 0.15));
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(37, 99, 235, 0.3);
            backdrop-filter: blur(5px);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .prediction-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.2);
        }
        
        .prediction-card h4 {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--gray-light);
        }
        
        .prediction-card p {
            font-size: 1.6rem;
            font-weight: 700;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }
        
        .betting-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .bet-control {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }
        
        .bet-control h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: var(--gray-light);
        }
        
        .amount-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .amount-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.7rem;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .amount-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .amount-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        
        .amount-input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        
        .amount-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .action-btn {
            flex: 1;
            padding: 0.9rem;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }
        
        .place-bet {
            background: var(--success);
            color: white;
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3);
        }
        
        .place-bet:hover {
            background: #0da271;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }
        
        .place-bet:active {
            transform: translateY(0);
        }
        
        .auto-cashout {
            background: var(--secondary);
            color: var(--dark);
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }
        
        .auto-cashout:hover {
            background: #e69009;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
        }
        
        .auto-cashout:active {
            transform: translateY(0);
        }
        
        .cashout {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }
        
        .cashout:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }
        
        .cashout:active {
            transform: translateY(0);
        }
        
        .history-container {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }
        
        .history-title {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: var(--gray-light);
        }
        
        .history-strip {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        
        .history-item {
            min-width: 45px;
            height: 45px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        
        .history-item:hover {
            transform: scale(1.1);
        }
        
        .history-item.win {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .history-item.loss {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        @keyframes airplaneTilt {
            0%, 100% { transform: translateY(-50%) rotate(0deg) translateX(0); }
            25% { transform: translateY(-50%) rotate(3deg) translateX(2px); }
            50% { transform: translateY(-50%) rotate(0deg) translateX(0); }
            75% { transform: translateY(-50%) rotate(-3deg) translateX(-2px); }
        }
        
        @keyframes crashShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        
        @keyframes explosion {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(10); opacity: 0; }
        }
        
        @media (max-width: 768px) {
            .game-container {
                margin: 1rem;
                padding: 1rem;
                border-radius: 12px;
            }
            
            .betting-area {
                grid-template-columns: 1fr;
            }
            
            .prediction-cards {
                grid-template-columns: 1fr 1fr;
            }
            
            .game-stats {
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-end;
            }
            
            .game-area {
                height: 180px;
            }
            
            .airplane {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="game-title">Aviator Predictor Pro</div>
            <div class="game-stats">
                <div class="stat-box">
                    <i class="fas fa-coins"></i> $<span id="balance">1,000.00</span>
                </div>
                <div class="stat-box">
                    <i class="fas fa-trophy"></i> <span id="wins">0</span>
                </div>
                <div class="stat-box">
                    <i class="fas fa-times"></i> <span id="losses">0</span>
                </div>
            </div>
        </div>
        
        <div class="game-area" id="gameArea">
            <div class="clouds" id="clouds"></div>
            <div class="flight-path"></div>
            <div class="particles" id="particles"></div>
            <svg class="airplane" id="airplane" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 16L5 14M5 14L8 11M5 14L3 12M5 14L7 16M21 8L19 10M19 10L16 13M19 10L21 12M19 10L17 8M9 15L12 12M12 12L15 9M12 12L9 9M12 12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="multiplier-display" id="multiplier">1.00x</div>
            <div class="crash-line" id="crashLine"></div>
        </div>
        
        <div class="prediction-area">
            <div class="prediction-header">
                <h3>AI Predictions <span class="ai-badge">LIVE</span></h3>
                <div class="stat-box">
                    <i class="fas fa-clock"></i> <span id="countdown">10</span>s
                </div>
            </div>
            <div class="prediction-cards">
                <div class="prediction-card">
                    <h4>Next Crash</h4>
                    <p id="nextCrash">2.45x</p>
                </div>
                <div class="prediction-card">
                    <h4>Confidence</h4>
                    <p id="confidence">85%</p>
                </div>
                <div class="prediction-card">
                    <h4>Safe Cashout</h4>
                    <p id="safeCashout">1.85x</p>
                </div>
                <div class="prediction-card">
                    <h4>Risk Level</h4>
                    <p id="riskLevel">Medium</p>
                </div>
            </div>
        </div>
        
        <div class="betting-area">
            <div class="bet-control">
                <h3>Bet Amount</h3>
                <div class="amount-buttons">
                    <button class="amount-btn" data-amount="10">$10</button>
                    <button class="amount-btn" data-amount="50">$50</button>
                    <button class="amount-btn" data-amount="100">$100</button>
                    <button class="amount-btn" data-amount="500">$500</button>
                    <button class="amount-btn" data-amount="1000">$1K</button>
                    <button class="amount-btn" data-amount="5000">$5K</button>
                </div>
                <input type="number" class="amount-input" id="betAmount" placeholder="Custom amount" min="1" value="10">
                <div class="action-buttons">
                    <button class="action-btn place-bet" id="placeBet">
                        <i class="fas fa-arrow-down"></i> Place Bet
                    </button>
                    <button class="action-btn auto-cashout" id="autoCashout">
                        <i class="fas fa-robot"></i> Auto 2x
                    </button>
                </div>
            </div>
            
            <div class="bet-control">
                <h3>Cashout</h3>
                <div class="amount-buttons">
                    <button class="amount-btn" data-multiplier="1.5">1.5x</button>
                    <button class="amount-btn" data-multiplier="2">2x</button>
                    <button class="amount-btn" data-multiplier="5">5x</button>
                    <button class="amount-btn active" data-multiplier="0">Manual</button>
                </div>
                <div class="action-buttons">
                    <button class="action-btn cashout" id="cashoutBtn" disabled>
                        <i class="fas fa-hand-holding-usd"></i> Cashout <span id="cashoutMultiplier">(1.00x)</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="history-container">
            <h3 class="history-title">Recent Results</h3>
            <div class="history-strip" id="historyStrip"></div>
        </div>
    </div>

    <script>
        // Enhanced Game State with Physics
        const game = {
            state: {
                running: false,
                multiplier: 1.0,
                crashPoint: 0,
                betAmount: 10,
                autoCashout: 0,
                balance: 1000,
                wins: 0,
                losses: 0,
                isBetPlaced: false,
                countdown: 10,
                history: [],
                gameSpeed: 100,
                maxMultiplier: 100,
                airplanePosition: 0,
                velocity: 0,
                acceleration: 0.0002,
                turbulence: 0,
                particles: []
            },
            
            elements: {
                airplane: document.getElementById('airplane'),
                multiplierDisplay: document.getElementById('multiplier'),
                gameArea: document.getElementById('gameArea'),
                crashLine: document.getElementById('crashLine'),
                balanceDisplay: document.getElementById('balance'),
                winsDisplay: document.getElementById('wins'),
                lossesDisplay: document.getElementById('losses'),
                placeBetBtn: document.getElementById('placeBet'),
                cashoutBtn: document.getElementById('cashoutBtn'),
                autoCashoutBtn: document.getElementById('autoCashout'),
                betAmountInput: document.getElementById('betAmount'),
                countdownDisplay: document.getElementById('countdown'),
                historyStrip: document.getElementById('historyStrip'),
                nextCrashDisplay: document.getElementById('nextCrash'),
                confidenceDisplay: document.getElementById('confidence'),
                safeCashoutDisplay: document.getElementById('safeCashout'),
                riskLevelDisplay: document.getElementById('riskLevel'),
                cashoutMultiplierDisplay: document.getElementById('cashoutMultiplier'),
                cloudsContainer: document.getElementById('clouds'),
                particlesContainer: document.getElementById('particles')
            },
            
            intervals: {
                game: null,
                countdown: null
            },
            
            init() {
                this.createClouds();
                this.createParticles();
                this.updateUI();
                this.generatePrediction();
                this.startCountdown();
                this.setupEventListeners();
                
                // Start animation loop
                requestAnimationFrame(this.animate.bind(this));
            },
            
            createClouds() {
                const cloudCount = 12;
                for (let i = 0; i < cloudCount; i++) {
                    const cloud = document.createElement('div');
                    cloud.className = 'cloud';
                    
                    const size = Math.random() * 80 + 40;
                    const opacity = Math.random() * 0.15 + 0.05;
                    const left = Math.random() * 100;
                    const top = Math.random() * 100;
                    const blur = Math.random() * 10 + 5;
                    const delay = Math.random() * 15;
                    
                    cloud.style.width = `${size}px`;
                    cloud.style.height = `${size}px`;
                    cloud.style.left = `${left}%`;
                    cloud.style.top = `${top}%`;
                    cloud.style.opacity = opacity;
                    cloud.style.filter = `blur(${blur}px)`;
                    cloud.style.animationDelay = `${delay}s`;
                    
                    this.elements.cloudsContainer.appendChild(cloud);
                }
            },
            
            createParticles() {
                // Create initial particles
                for (let i = 0; i < 20; i++) {
                    this.state.particles.push({
                        x: Math.random() * this.elements.gameArea.offsetWidth,
                        y: Math.random() * this.elements.gameArea.offsetHeight,
                        size: Math.random() * 2 + 1,
                        speed: Math.random() * 0.2 + 0.1,
                        opacity: Math.random() * 0.1 + 0.05,
                        direction: Math.random() * Math.PI * 2
                    });
                }
            },
            
            animateParticles() {
                // Clear existing particles
                this.elements.particlesContainer.innerHTML = '';
                
                // Update and render particles
                this.state.particles.forEach(particle => {
                    // Update position
                    particle.x += Math.cos(particle.direction) * particle.speed;
                    particle.y += Math.sin(particle.direction) * particle.speed;
                    
                    // Wrap around screen edges
                    if (particle.x < 0) particle.x = this.elements.gameArea.offsetWidth;
                    if (particle.x > this.elements.gameArea.offsetWidth) particle.x = 0;
                    if (particle.y < 0) particle.y = this.elements.gameArea.offsetHeight;
                    if (particle.y > this.elements.gameArea.offsetHeight) particle.y = 0;
                    
                    // Create particle element
                    const particleEl = document.createElement('div');
                    particleEl.className = 'particle';
                    particleEl.style.width = `${particle.size}px`;
                    particleEl.style.height = `${particle.size}px`;
                    particleEl.style.left = `${particle.x}px`;
                    particleEl.style.top = `${particle.y}px`;
                    particleEl.style.opacity = particle.opacity;
                    particleEl.style.backgroundColor = `rgba(255, 255, 255, ${particle.opacity})`;
                    
                    this.elements.particlesContainer.appendChild(particleEl);
                });
            },
            
            animate() {
                // Update airplane tilt based on velocity
                if (this.state.running) {
                    const tiltAmount = Math.min(this.state.velocity * 50, 15);
                    const turbulence = Math.sin(Date.now() * 0.005) * this.state.turbulence;
                    this.elements.airplane.style.transform = `translateY(-50%) rotate(${turbulence + tiltAmount}deg)`;
                }
                
                this.animateParticles();
                requestAnimationFrame(this.animate.bind(this));
            },
            
            setupEventListeners() {
                // Bet amount buttons
                document.querySelectorAll('.amount-btn[data-amount]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.state.betAmount = parseFloat(btn.dataset.amount);
                        this.elements.betAmountInput.value = this.state.betAmount;
                        this.updateActiveButtons();
                    });
                });

                // Cashout multiplier buttons
                document.querySelectorAll('.amount-btn[data-multiplier]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.state.autoCashout = parseFloat(btn.dataset.multiplier);
                        if (this.state.autoCashout > 0) {
                            this.elements.autoCashoutBtn.textContent = `Auto ${this.state.autoCashout}x`;
                        }
                        this.updateActiveButtons();
                    });
                });

                // Custom bet amount input
                this.elements.betAmountInput.addEventListener('input', () => {
                    this.state.betAmount = parseFloat(this.elements.betAmountInput.value) || 0;
                    this.updateActiveButtons();
                });

                // Place bet button
                this.elements.placeBetBtn.addEventListener('click', this.placeBet.bind(this));

                // Cashout button
                this.elements.cashoutBtn.addEventListener('click', this.cashout.bind(this));

                // Auto cashout button
                this.elements.autoCashoutBtn.addEventListener('click', () => {
                    const newMultiplier = prompt('Set auto cashout multiplier (0 for manual):', this.state.autoCashout || 2);
                    if (newMultiplier !== null) {
                        this.state.autoCashout = parseFloat(newMultiplier) || 0;
                        this.elements.autoCashoutBtn.textContent = this.state.autoCashout > 0 ? 
                            `Auto ${this.state.autoCashout}x` : 'Auto Off';
                        this.updateActiveButtons();
                    }
                });
            },
            
            updateActiveButtons() {
                // Bet amount buttons
                document.querySelectorAll('.amount-btn[data-amount]').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.amount) === this.state.betAmount);
                });

                // Cashout multiplier buttons
                document.querySelectorAll('.amount-btn[data-multiplier]').forEach(btn => {
                    btn.classList.toggle('active', parseFloat(btn.dataset.multiplier) === this.state.autoCashout);
                });
            },
            
            startCountdown() {
                this.state.countdown = 10;
                this.updateUI();
                clearInterval(this.intervals.countdown);
                
                this.intervals.countdown = setInterval(() => {
                    this.state.countdown--;
                    this.updateUI();
                    
                    if (this.state.countdown <= 0) {
                        clearInterval(this.intervals.countdown);
                        if (!this.state.running) {
                            this.startGame();
                        }
                    }
                }, 1000);
            },
            
            generatePrediction() {
                // Base prediction with volatility-based randomness
                const volatility = 0.5 + Math.random() * 0.5; // 0.5-1.0
                const baseCrash = 1.3 + Math.random() * 4 * volatility; // 1.3-5.3x
                const confidence = Math.floor(70 + Math.random() * 25 * (1 - volatility)); // 70-95%
                const safeCashout = baseCrash * (0.7 + Math.random() * 0.1); // 70-80% of prediction
                
                // Risk level based on volatility
                let riskLevel;
                if (volatility < 0.7) riskLevel = 'Low';
                else if (volatility < 0.9) riskLevel = 'Medium';
                else riskLevel = 'High';
                
                // Actual crash point will be within 80-120% of prediction
                this.state.crashPoint = baseCrash * (0.8 + Math.random() * 0.4);
                this.state.turbulence = volatility * 0.5; // More turbulence for volatile rounds

                // Update UI
                this.elements.nextCrashDisplay.textContent = baseCrash.toFixed(2) + 'x';
                this.elements.confidenceDisplay.textContent = confidence + '%';
                this.elements.safeCashoutDisplay.textContent = safeCashout.toFixed(2) + 'x';
                this.elements.riskLevelDisplay.textContent = riskLevel;
            },
            
            placeBet() {
                if (this.state.running || this.state.isBetPlaced) return;
                
                // Validate bet amount
                if (this.state.betAmount <= 0 || isNaN(this.state.betAmount)) {
                    alert('Please enter a valid bet amount');
                    return;
                }
                
                if (this.state.betAmount > this.state.balance) {
                    alert('Insufficient balance');
                    return;
                }
                
                // Deduct bet amount and update state
                this.state.balance -= this.state.betAmount;
                this.state.isBetPlaced = true;
                
                // Update UI
                this.elements.placeBetBtn.disabled = true;
                this.elements.cashoutBtn.disabled = false;
                this.updateUI();
                
                // Add airplane animation
                this.elements.airplane.style.animation = 'airplaneTilt 0.8s infinite';
            },
            
            cashout() {
                if (!this.state.isBetPlaced || !this.state.running) return;
                
                // Calculate winnings
                const winAmount = this.state.betAmount * this.state.multiplier;
                this.state.balance += winAmount;
                this.state.wins++;
                
                // Add explosion effect
                this.createExplosion(this.state.airplanePosition, this.elements.gameArea.offsetHeight / 2);
                
                // Add to history
                this.addToHistory(true, this.state.multiplier);
                
                // Reset for next bet
                this.resetBet();
                this.updateUI();
            },
            
            createExplosion(x, y) {
                const explosion = document.createElement('div');
                explosion.style.position = 'absolute';
                explosion.style.left = `${x}px`;
                explosion.style.top = `${y}px`;
                explosion.style.width = '20px';
                explosion.style.height = '20px';
                explosion.style.borderRadius = '50%';
                explosion.style.background = 'radial-gradient(circle, rgba(245,158,11,1) 0%, rgba(239,68,68,0) 70%)';
                explosion.style.transformOrigin = 'center center';
                explosion.style.animation = 'explosion 0.5s forwards';
                explosion.style.zIndex = '20';
                
                this.elements.gameArea.appendChild(explosion);
                
                // Remove after animation
                setTimeout(() => {
                    explosion.remove();
                }, 500);
            },
            
            startGame() {
                this.state.running = true;
                this.state.multiplier = 1.0;
                this.state.velocity = 0;
                this.state.acceleration = 0.0002;
                
                // Reset airplane position
                this.state.airplanePosition = 30;
                this.elements.airplane.style.left = '30px';
                
                // Position crash line
                const gameWidth = this.elements.gameArea.offsetWidth - 90;
                const crashPosition = 30 + (gameWidth * 0.95);
                this.elements.crashLine.style.left = `${crashPosition}px`;
                this.elements.crashLine.style.display = 'block';
                
                // Start game loop
                clearInterval(this.intervals.game);
                this.intervals.game = setInterval(this.updateGame.bind(this), this.state.gameSpeed);
            },
            
            updateGame() {
                // Increase velocity with acceleration
                this.state.velocity += this.state.acceleration;
                
                // Apply turbulence
                const turbulenceEffect = Math.sin(Date.now() * 0.005) * this.state.turbulence * 0.1;
                
                // Update multiplier with velocity and turbulence
                this.state.multiplier += this.state.velocity + turbulenceEffect;
                
                // Update airplane position
                const gameWidth = this.elements.gameArea.offsetWidth - 90;
                const progress = Math.min(this.state.multiplier / 10, 1);
                this.state.airplanePosition = 30 + (gameWidth * progress);
                this.elements.airplane.style.left = `${this.state.airplanePosition}px`;
                
                // Update multiplier display
                this.elements.multiplierDisplay.textContent = this.state.multiplier.toFixed(2) + 'x';
                
                // Update cashout button if bet is placed
                if (this.state.isBetPlaced) {
                    this.elements.cashoutMultiplierDisplay.textContent = `(${this.state.multiplier.toFixed(2)}x)`;
                    
                    // Auto cashout if set
                    if (this.state.autoCashout > 0 && this.state.multiplier >= this.state.autoCashout) {
                        this.cashout();
                        return;
                    }
                }
                
                // Check for crash
                if (this.state.multiplier >= this.state.crashPoint) {
                    this.endGame();
                    return;
                }
                
                // Small chance of random early crash (scales with multiplier)
                if (this.state.multiplier > 1.5 && Math.random() < 0.005 * Math.log(this.state.multiplier)) {
                    this.endGame();
                }
            },
            
            endGame() {
                clearInterval(this.intervals.game);
                this.state.running = false;
                
                // Crash animation
                this.elements.gameArea.style.animation = 'crashShake 0.4s';
                setTimeout(() => {
                    this.elements.gameArea.style.animation = '';
                }, 400);
                
                // Create explosion at crash point
                this.createExplosion(this.state.airplanePosition, this.elements.gameArea.offsetHeight / 2);
                
                // If bet was placed and not cashed out
                if (this.state.isBetPlaced) {
                    this.state.losses++;
                    this.addToHistory(false, 0);
                    this.resetBet();
                }
                
                // Start next round
                this.generatePrediction();
                this.startCountdown();
                this.updateUI();
            },
            
            resetBet() {
                this.state.isBetPlaced = false;
                this.elements.placeBetBtn.disabled = false;
                this.elements.cashoutBtn.disabled = true;
                this.elements.airplane.style.animation = '';
            },
            
            addToHistory(win, multiplier) {
                // Add to history array (limit to 20 items)
                this.state.history.unshift({
                    win: win,
                    multiplier: multiplier
                });
                
                if (this.state.history.length > 20) {
                    this.state.history.pop();
                }
                
                // Update history display
                this.updateHistoryDisplay();
            },
            
            updateHistoryDisplay() {
                this.elements.historyStrip.innerHTML = '';
                
                this.state.history.forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = `history-item ${item.win ? 'win' : 'loss'}`;
                    historyItem.textContent = item.win ? item.multiplier.toFixed(1) + 'x' : 'CRASH';
                    this.elements.historyStrip.appendChild(historyItem);
                });
            },
            
            updateUI() {
                this.elements.balanceDisplay.textContent = this.state.balance.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                this.elements.winsDisplay.textContent = this.state.wins;
                this.elements.lossesDisplay.textContent = this.state.losses;
                this.elements.countdownDisplay.textContent = this.state.countdown;
            }
        };

        // Initialize the game when page loads
        window.addEventListener('load', () => game.init());
    </script>
</body>
</html>
