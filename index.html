<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AviatorWin AI - Advanced Aviator Predictor</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #f59e0b;
            --dark: #1e293b;
            --light: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
            --gray: #64748b;
            --gray-light: #e2e8f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #0f172a;
            color: white;
            overflow-x: hidden;
        }
        
        .game-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1.5rem;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary);
        }
        
        .game-stats {
            display: flex;
            gap: 1rem;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .game-area {
            position: relative;
            height: 200px;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .flight-path {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateY(-50%);
        }
        
        .airplane {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            transition: left 0.05s linear;
            z-index: 10;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }
        
        .multiplier-display {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            font-weight: 700;
            color: var(--secondary);
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.7);
            background: rgba(0, 0, 0, 0.5);
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }
        
        .crash-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(transparent, var(--danger), transparent);
            display: none;
            z-index: 5;
        }
        
        .crash-line::after {
            content: 'CRASH';
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--danger);
            font-weight: 700;
            font-size: 0.8rem;
        }
        
        .prediction-area {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .prediction-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            align-items: center;
        }
        
        .prediction-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }
        
        .prediction-card {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(30, 64, 175, 0.2));
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(37, 99, 235, 0.3);
        }
        
        .prediction-card h4 {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--gray-light);
        }
        
        .prediction-card p {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .betting-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .bet-control {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .bet-control h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: var(--gray-light);
        }
        
        .amount-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .amount-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            padding: 0.7rem;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .amount-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .amount-btn.active {
            background: var(--primary);
            color: white;
        }
        
        .amount-input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .action-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .place-bet {
            background: var(--success);
            color: white;
        }
        
        .place-bet:hover {
            background: #0da271;
        }
        
        .auto-cashout {
            background: var(--secondary);
            color: var(--dark);
        }
        
        .auto-cashout:hover {
            background: #e69009;
        }
        
        .cashout {
            background: var(--primary);
            color: white;
        }
        
        .cashout:hover {
            background: var(--primary-dark);
        }
        
        .history-container {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .history-title {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            color: var(--gray-light);
        }
        
        .history-strip {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        
        .history-item {
            min-width: 40px;
            height: 40px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .history-item.win {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .history-item.loss {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(5px);
        }
        
        @keyframes airplaneTilt {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            50% { transform: translateY(-50%) rotate(3deg); }
        }
        
        @keyframes crashShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        
        @media (max-width: 768px) {
            .game-container {
                margin: 1rem;
                padding: 1rem;
            }
            
            .betting-area {
                grid-template-columns: 1fr;
            }
            
            .prediction-cards {
                grid-template-columns: 1fr 1fr;
            }
            
            .game-stats {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <script>
        // Game State
        const gameState = {
            running: false,
            multiplier: 1.0,
            crashPoint: 0,
            betAmount: 10,
            autoCashout: 0,
            balance: 1000,
            wins: 0,
            losses: 0,
            isBetPlaced: false,
            countdown: 10,
            history: [],
            gameSpeed: 100, // ms per game tick
            maxMultiplier: 100,
            airplanePosition: 0
        };

        // DOM Elements
        const elements = {
            airplane: document.getElementById('airplane'),
            multiplierDisplay: document.getElementById('multiplier'),
            gameArea: document.getElementById('gameArea'),
            crashLine: document.getElementById('crashLine'),
            balanceDisplay: document.getElementById('balance'),
            winsDisplay: document.getElementById('wins'),
            lossesDisplay: document.getElementById('losses'),
            placeBetBtn: document.getElementById('placeBet'),
            cashoutBtn: document.getElementById('cashoutBtn'),
            autoCashoutBtn: document.getElementById('autoCashout'),
            betAmountInput: document.getElementById('betAmount'),
            countdownDisplay: document.getElementById('countdown'),
            historyStrip: document.getElementById('historyStrip'),
            nextCrashDisplay: document.getElementById('nextCrash'),
            confidenceDisplay: document.getElementById('confidence'),
            safeCashoutDisplay: document.getElementById('safeCashout'),
            riskLevelDisplay: document.getElementById('riskLevel'),
            cashoutMultiplierDisplay: document.getElementById('cashoutMultiplier'),
            cloudsContainer: document.getElementById('clouds')
        };

        // Game Loop Variables
        let gameInterval;
        let countdownInterval;
        let crashAnimationFrame;

        // Initialize the game
        function initGame() {
            createClouds();
            updateUI();
            generatePrediction();
            startCountdown();
            setupEventListeners();
        }

        // Create decorative clouds
        function createClouds() {
            const cloudCount = 8;
            for (let i = 0; i < cloudCount; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                
                // Random cloud properties
                const size = Math.random() * 50 + 30;
                const opacity = Math.random() * 0.2 + 0.05;
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const blur = Math.random() * 5 + 3;
                
                cloud.style.width = `${size}px`;
                cloud.style.height = `${size}px`;
                cloud.style.left = `${left}%`;
                cloud.style.top = `${top}%`;
                cloud.style.opacity = opacity;
                cloud.style.filter = `blur(${blur}px)`;
                
                elements.cloudsContainer.appendChild(cloud);
            }
        }

        // Set up event listeners
        function setupEventListeners() {
            // Bet amount buttons
            document.querySelectorAll('.amount-btn[data-amount]').forEach(btn => {
                btn.addEventListener('click', () => {
                    gameState.betAmount = parseFloat(btn.dataset.amount);
                    elements.betAmountInput.value = gameState.betAmount;
                    updateActiveButtons();
                });
            });

            // Cashout multiplier buttons
            document.querySelectorAll('.amount-btn[data-multiplier]').forEach(btn => {
                btn.addEventListener('click', () => {
                    gameState.autoCashout = parseFloat(btn.dataset.multiplier);
                    if (gameState.autoCashout > 0) {
                        elements.autoCashoutBtn.textContent = `Auto ${gameState.autoCashout}x`;
                    }
                    updateActiveButtons();
                });
            });

            // Custom bet amount input
            elements.betAmountInput.addEventListener('input', () => {
                gameState.betAmount = parseFloat(elements.betAmountInput.value) || 0;
                updateActiveButtons();
            });

            // Place bet button
            elements.placeBetBtn.addEventListener('click', placeBet);

            // Cashout button
            elements.cashoutBtn.addEventListener('click', cashout);

            // Auto cashout button
            elements.autoCashoutBtn.addEventListener('click', () => {
                const newMultiplier = prompt('Set auto cashout multiplier (0 for manual):', gameState.autoCashout || 2);
                if (newMultiplier !== null) {
                    gameState.autoCashout = parseFloat(newMultiplier) || 0;
                    elements.autoCashoutBtn.textContent = gameState.autoCashout > 0 ? 
                        `Auto ${gameState.autoCashout}x` : 'Auto Off';
                    updateActiveButtons();
                }
            });
        }

        // Update active button states
        function updateActiveButtons() {
            // Bet amount buttons
            document.querySelectorAll('.amount-btn[data-amount]').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.amount) === gameState.betAmount);
            });

            // Cashout multiplier buttons
            document.querySelectorAll('.amount-btn[data-multiplier]').forEach(btn => {
                btn.classList.toggle('active', parseFloat(btn.dataset.multiplier) === gameState.autoCashout);
            });
        }

        // Start the countdown to next round
        function startCountdown() {
            gameState.countdown = 10;
            updateUI();
            clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                gameState.countdown--;
                updateUI();
                
                if (gameState.countdown <= 0) {
                    clearInterval(countdownInterval);
                    if (!gameState.running) {
                        startGame();
                    }
                }
            }, 1000);
        }

        // Generate AI prediction
        function generatePrediction() {
            // Base prediction with some randomness
            const baseCrash = 1.5 + Math.random() * 3; // 1.5-4.5x
            const confidence = 70 + Math.floor(Math.random() * 30); // 70-99%
            const safeCashout = baseCrash * 0.75; // 75% of predicted crash
            
            // Risk level based on volatility
            const volatility = Math.random();
            let riskLevel;
            if (volatility < 0.3) riskLevel = 'Low';
            else if (volatility < 0.7) riskLevel = 'Medium';
            else riskLevel = 'High';
            
            // Actual crash point will be within 80-120% of prediction
            gameState.crashPoint = baseCrash * (0.8 + Math.random() * 0.4);

            // Update UI
            elements.nextCrashDisplay.textContent = baseCrash.toFixed(2) + 'x';
            elements.confidenceDisplay.textContent = confidence + '%';
            elements.safeCashoutDisplay.textContent = safeCashout.toFixed(2) + 'x';
            elements.riskLevelDisplay.textContent = riskLevel;
        }

        // Place a bet
        function placeBet() {
            if (gameState.running || gameState.isBetPlaced) return;
            
            // Validate bet amount
            if (gameState.betAmount <= 0 || isNaN(gameState.betAmount)) {
                alert('Please enter a valid bet amount');
                return;
            }
            
            if (gameState.betAmount > gameState.balance) {
                alert('Insufficient balance');
                return;
            }
            
            // Deduct bet amount and update state
            gameState.balance -= gameState.betAmount;
            gameState.isBetPlaced = true;
            
            // Update UI
            elements.placeBetBtn.disabled = true;
            elements.cashoutBtn.disabled = false;
            updateUI();
            
            // Add slight airplane animation when bet is placed
            elements.airplane.style.animation = 'airplaneTilt 0.5s infinite alternate';
        }

        // Cash out
        function cashout() {
            if (!gameState.isBetPlaced || !gameState.running) return;
            
            // Calculate winnings
            const winAmount = gameState.betAmount * gameState.multiplier;
            gameState.balance += winAmount;
            gameState.wins++;
            
            // Add to history
            addToHistory(true, gameState.multiplier);
            
            // Reset for next bet
            resetBet();
            updateUI();
        }

        // Start the game round
        function startGame() {
            gameState.running = true;
            gameState.multiplier = 1.0;
            
            // Reset airplane position
            gameState.airplanePosition = 0;
            elements.airplane.style.left = '30px';
            
            // Position crash line (convert multiplier to % of game area width)
            const gameWidth = elements.gameArea.offsetWidth - 90; // Account for airplane width
            const crashPosition = 30 + (gameWidth * 0.95); // Show at 95% of max
            elements.crashLine.style.left = `${crashPosition}px`;
            elements.crashLine.style.display = 'block';
            
            // Start game loop
            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, gameState.gameSpeed);
        }

        // Update game state
        function updateGame() {
            // Increase multiplier with accelerating growth
            const growthRate = 0.02 + (gameState.multiplier * 0.001);
            gameState.multiplier += growthRate * (0.8 + Math.random() * 0.4);
            
            // Update airplane position
            const gameWidth = elements.gameArea.offsetWidth - 90;
            const progress = Math.min(gameState.multiplier / 10, 1); // Cap at 10x for display
            gameState.airplanePosition = 30 + (gameWidth * progress);
            elements.airplane.style.left = `${gameState.airplanePosition}px`;
            
            // Update multiplier display
            elements.multiplierDisplay.textContent = gameState.multiplier.toFixed(2) + 'x';
            
            // Update cashout button if bet is placed
            if (gameState.isBetPlaced) {
                elements.cashoutMultiplierDisplay.textContent = `(${gameState.multiplier.toFixed(2)}x)`;
                
                // Auto cashout if set
                if (gameState.autoCashout > 0 && gameState.multiplier >= gameState.autoCashout) {
                    cashout();
                    return;
                }
            }
            
            // Check for crash
            if (gameState.multiplier >= gameState.crashPoint) {
                endGame();
            }
            
            // Small chance of random early crash (1% when above 2x)
            if (gameState.multiplier > 2 && Math.random() < 0.01) {
                endGame();
            }
        }

        // End the game (crash)
        function endGame() {
            clearInterval(gameInterval);
            gameState.running = false;
            
            // Crash animation
            elements.gameArea.style.animation = 'crashShake 0.3s';
            setTimeout(() => {
                elements.gameArea.style.animation = '';
            }, 300);
            
            // If bet was placed and not cashed out
            if (gameState.isBetPlaced) {
                gameState.losses++;
                addToHistory(false, 0);
                resetBet();
            }
            
            // Start next round
            generatePrediction();
            startCountdown();
            updateUI();
        }

        // Reset bet state
        function resetBet() {
            gameState.isBetPlaced = false;
            elements.placeBetBtn.disabled = false;
            elements.cashoutBtn.disabled = true;
            elements.airplane.style.animation = '';
        }

        // Add result to history
        function addToHistory(win, multiplier) {
            // Add to history array (limit to 20 items)
            gameState.history.unshift({
                win: win,
                multiplier: multiplier
            });
            
            if (gameState.history.length > 20) {
                gameState.history.pop();
            }
            
            // Update history display
            updateHistoryDisplay();
        }

        // Update history display
        function updateHistoryDisplay() {
            elements.historyStrip.innerHTML = '';
            
            gameState.history.forEach(item => {
                const historyItem = document.createElement('div');
                historyItem.className = `history-item ${item.win ? 'win' : 'loss'}`;
                historyItem.textContent = item.win ? item.multiplier.toFixed(1) + 'x' : 'CRASH';
                elements.historyStrip.appendChild(historyItem);
            });
        }

        // Update all UI elements
        function updateUI() {
            elements.balanceDisplay.textContent = gameState.balance.toFixed(2);
            elements.winsDisplay.textContent = gameState.wins;
            elements.lossesDisplay.textContent = gameState.losses;
            elements.countdownDisplay.textContent = gameState.countdown;
        }

        // Initialize the game when page loads
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
