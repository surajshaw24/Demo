
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚀 Quantum Tools Suite - World's Most Advanced</title>
    <!-- Quantum CSS Framework -->
    <style>
        /* === QUANTUM RESET & BASE === */
        :root {
            --quantum-primary: #6366f1;
            --quantum-secondary: #8b5cf6;
            --quantum-accent: #ec4899;
            --quantum-success: #10b981;
            --quantum-warning: #f59e0b;
            --quantum-danger: #ef4444;
            --quantum-info: #3b82f6;
            --quantum-dark: #1f2937;
            --quantum-light: #f9fafb;
            --quantum-gradient: linear-gradient(135deg, var(--quantum-primary), var(--quantum-secondary));
            --quantum-glass: rgba(255, 255, 255, 0.1);
            --quantum-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            --quantum-blur: blur(20px);
            --quantum-radius: 20px;
            --quantum-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--quantum-dark);
            line-height: 1.6;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* === QUANTUM LAYOUT === */
        .quantum-container {
            max-width: 100%;
            padding: 1rem;
            margin: 0 auto;
        }

        @media (min-width: 640px) { .quantum-container { max-width: 640px; padding: 1.5rem; } }
        @media (min-width: 768px) { .quantum-container { max-width: 768px; padding: 2rem; } }
        @media (min-width: 1024px) { .quantum-container { max-width: 1024px; padding: 2.5rem; } }
        @media (min-width: 1280px) { .quantum-container { max-width: 1280px; } }

        /* === QUANTUM GLASSMORPHISM === */
        .quantum-glass {
            background: var(--quantum-glass);
            backdrop-filter: var(--quantum-blur);
            -webkit-backdrop-filter: var(--quantum-blur);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--quantum-radius);
            box-shadow: var(--quantum-shadow);
        }

        /* === QUANTUM HEADER === */
        .quantum-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .quantum-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--quantum-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .quantum-logo i {
            font-size: 2rem;
        }

        /* === QUANTUM NAVIGATION === */
        .quantum-nav {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: white;
            z-index: 2000;
            padding: 5rem 1.5rem 2rem;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: var(--quantum-transition);
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.1);
        }

        .quantum-nav.active {
            transform: translateX(0);
        }

        .nav-toggle {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--quantum-gradient);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            transition: var(--quantum-transition);
        }

        .nav-toggle:hover {
            transform: scale(1.05);
        }

        .nav-category {
            margin-bottom: 2rem;
        }

        .nav-category h3 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: var(--quantum-transition);
            color: #4b5563;
            text-decoration: none;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--quantum-gradient);
            color: white;
            transform: translateX(5px);
        }

        .nav-item i {
            width: 24px;
            text-align: center;
            font-size: 1.25rem;
        }

        .nav-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f3f4f6;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.25rem;
            color: #6b7280;
        }

        /* === QUANTUM MAIN CONTENT === */
        .quantum-main {
            margin-top: 80px;
            min-height: calc(100vh - 80px);
            padding-bottom: 100px;
        }

        .tool-section {
            display: none;
            animation: quantumFadeIn 0.5s ease;
        }

        .tool-section.active {
            display: block;
        }

        @keyframes quantumFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === QUANTUM TOOL CARD === */
        .quantum-tool {
            margin-bottom: 1.5rem;
        }

        .tool-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(99, 102, 241, 0.1);
        }

        .tool-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--quantum-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tool-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #f3f4f6;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            cursor: pointer;
            transition: var(--quantum-transition);
        }

        .action-btn:hover {
            background: var(--quantum-gradient);
            color: white;
            transform: translateY(-2px);
        }

        /* === QUANTUM INPUT GROUPS === */
        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--quantum-dark);
            font-size: 0.9375rem;
        }

        .input-label i {
            color: var(--quantum-primary);
        }

        .quantum-input, .quantum-select, .quantum-textarea {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--quantum-transition);
            background: white;
        }

        .quantum-input:focus, .quantum-select:focus, .quantum-textarea:focus {
            outline: none;
            border-color: var(--quantum-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        .input-with-icon input {
            padding-left: 3.5rem;
        }

        /* === QUANTUM BUTTONS === */
        .quantum-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--quantum-transition);
            text-decoration: none;
        }

        .quantum-btn-primary {
            background: var(--quantum-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .quantum-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .quantum-btn-block {
            width: 100%;
        }

        .quantum-btn-lg {
            padding: 1.25rem 2.5rem;
            font-size: 1.125rem;
        }

        /* === QUANTUM RESULTS === */
        .quantum-result {
            margin-top: 2rem;
            padding: 1.5rem;
            background: white;
            border-radius: var(--quantum-radius);
            box-shadow: var(--quantum-shadow);
            border-left: 6px solid var(--quantum-primary);
            display: none;
        }

        .quantum-result.active {
            display: block;
            animation: quantumSlideIn 0.5s ease;
        }

        @keyframes quantumSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            color: var(--quantum-primary);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .result-grid {
            display: grid;
            gap: 1rem;
        }

        .result-item {
            padding: 1rem;
            background: #f9fafb;
            border-radius: 8px;
        }

        .result-label {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 0.25rem;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--quantum-dark);
        }

        /* === QUANTUM CHARTS === */
        .quantum-chart {
            height: 300px;
            margin-top: 2rem;
            position: relative;
        }

        /* === QUANTUM BOTTOM NAV === */
        .quantum-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 0.75rem 1rem;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            justify-content: space-around;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem;
            border-radius: 12px;
            color: #6b7280;
            text-decoration: none;
            transition: var(--quantum-transition);
            min-width: 60px;
        }

        .bottom-nav-item.active {
            color: var(--quantum-primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .bottom-nav-item i {
            font-size: 1.25rem;
        }

        .bottom-nav-label {
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* === QUANTUM LOADING === */
        .quantum-loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .quantum-loading.active {
            display: flex;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #e5e7eb;
            border-top-color: var(--quantum-primary);
            border-radius: 50%;
            animation: quantumSpin 1s linear infinite;
        }

        @keyframes quantumSpin {
            to { transform: rotate(360deg); }
        }

        /* === QUANTUM TOAST === */
        .quantum-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--quantum-dark);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            opacity: 0;
            transition: var(--quantum-transition);
        }

        .quantum-toast.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* === QUANTUM THEME === */
        .quantum-theme-dark {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
        }

        .quantum-theme-dark .quantum-glass {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(148, 163, 184, 0.2);
        }

        /* === RESPONSIVE OPTIMIZATIONS === */
        @media (max-width: 640px) {
            html { font-size: 14px; }
            .quantum-header { padding: 0.75rem; }
            .quantum-main { margin-top: 70px; }
            .tool-header h1 { font-size: 1.5rem; }
            .quantum-result { padding: 1rem; }
            .result-value { font-size: 1.25rem; }
        }

        @media (max-width: 480px) {
            .quantum-container { padding: 0.75rem; }
            .quantum-btn { padding: 0.875rem 1.5rem; }
            .bottom-nav-item { min-width: 50px; }
            .bottom-nav-item i { font-size: 1.125rem; }
        }

        /* === PERFORMANCE OPTIMIZATIONS === */
        .will-change {
            will-change: transform, opacity;
        }

        /* === QUANTUM AI ASSISTANT === */
        .quantum-ai {
            position: fixed;
            bottom: 80px;
            right: 1rem;
            z-index: 1000;
        }

        .ai-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--quantum-gradient);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            transition: var(--quantum-transition);
        }

        .ai-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        .ai-panel {
            position: absolute;
            bottom: 70px;
            right: 0;
            width: 300px;
            background: white;
            border-radius: var(--quantum-radius);
            box-shadow: var(--quantum-shadow);
            padding: 1.5rem;
            display: none;
        }

        .ai-panel.active {
            display: block;
            animation: quantumFadeIn 0.3s ease;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .ai-header h3 {
            font-size: 1.125rem;
            color: var(--quantum-dark);
        }

        .ai-message {
            padding: 0.75rem;
            background: #f3f4f6;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        .ai-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.875rem;
        }

        /* === QUANTUM FOOTER === */
        .quantum-footer {
            text-align: center;
            padding: 2rem 1rem;
            color: white;
            opacity: 0.8;
            font-size: 0.875rem;
        }

        /* === QUANTUM UTILITY CLASSES === */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .p-4 { padding: 1rem; }
        .text-center { text-align: center; }
        .text-primary { color: var(--quantum-primary); }
        .text-success { color: var(--quantum-success); }
        .text-warning { color: var(--quantum-warning); }
        .text-danger { color: var(--quantum-danger); }
        .bg-gradient { background: var(--quantum-gradient); }
    </style>
    
    <!-- Quantum Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Quantum Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
