<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hand-Controlled Particle System with Texture</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="x-shader/x-vertex" id="vertexshader">
        // Attributes (dữ liệu riêng cho mỗi hạt)
        attribute float aSize;
        attribute vec3 aColor;
        attribute float aLifetime; 
        attribute vec3 aInitialPosition;
        attribute vec3 aVelocity;

        // Uniforms (dữ liệu chung được truyền từ JS)
        uniform float uTime;
        uniform vec3 uHandPosition; 
        uniform int uTemplate;     // Mẫu hình: 0-Firework, 1-Heart, 2-Saturn
        uniform float uGlobalScale; 
        uniform float uRepulsionRadius; 

        varying vec3 vColor;
        
        // Hàm tạo hình trái tim
        vec3 heartShape(vec3 pos, float scale) {
            float x = pos.x * scale;
            float y = pos.y * scale;
            float z = pos.z * scale;
            
            float r = sqrt(x*x + y*y);
            float angle = atan(y, x);
            float heart_r = 1.0 + 0.1 * cos(angle * 7.0);
            
            x = r * heart_r * cos(angle);
            y = r * heart_r * sin(angle) * 1.5;
            
            return vec3(x, y - 0.5, z);
        }
        
        // Hàm tạo hình Saturn
        vec3 saturnShape(vec3 pos, float scale) {
            float radius = length(pos.xy) * scale;
            float angle = atan(pos.y, pos.x);
            return vec3(cos(angle) * radius, sin(angle) * radius, pos.z * 0.1);
        }

        void main() {
            vColor = aColor;
            vec3 particlePos = aInitialPosition;
            
            // 1. Movement
            if (uTemplate == 0) { // Firework
                particlePos += aVelocity * uTime;
                particlePos.y -= 0.5 * uTime * uTime; 
            }
            
            // 2. Shaping (Áp dụng template)
            if (uTemplate == 1) { // Heart
                particlePos = heartShape(particlePos, uGlobalScale);
            } else if (uTemplate == 2) { // Saturn
                particlePos = saturnShape(particlePos, uGlobalScale);
            }
            
            // 3. Hand Interaction (Lực đẩy)
            float distanceToHand = length(particlePos - uHandPosition);
            
            if (distanceToHand < uRepulsionRadius) {
                vec3 repulsionVector = normalize(particlePos - uHandPosition) * (uRepulsionRadius - distanceToHand) * 0.05;
                particlePos += repulsionVector;
            }

            // Tính toán vị trí cuối cùng
            vec4 mvPosition = modelViewMatrix * vec4(particlePos, 1.0);

            // Kích thước điểm
            gl_PointSize = aSize * (500.0 / -mvPosition.z) * uGlobalScale;
            
            // Thiết lập kích thước điểm cố định nếu dùng texture có hình dạng phức tạp
            // gl_PointSize = aSize * uGlobalScale;
            
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
        varying vec3 vColor;
        uniform vec3 uColorShift;
        uniform sampler2D uParticleTexture; // Texture hình ảnh của hạt
        
        void main() {
            // Lấy màu từ texture tại tọa độ của điểm (gl_PointCoord từ 0.0 đến 1.0)
            vec4 texel = texture2D(uParticleTexture, gl_PointCoord);
            
            // Sử dụng màu của texture (texel.rgb) và độ mờ của texture (texel.a)
            // Màu cuối cùng = Màu gốc * Thay đổi màu * Màu từ texture
            vec3 finalColor = vColor * uColorShift * texel.rgb;
            
            // Độ mờ cuối cùng: Dùng độ mờ từ texture
            gl_FragColor = vec4(finalColor, texel.a);
            
            // LƯU Ý: Nếu ảnh texture là trắng trên nền trong suốt (hoặc đen),
            // bạn chỉ cần nhân độ mờ (texel.a) với độ mờ của hệ thống
            // gl_FragColor = vec4(vColor * uColorShift, texel.a);
        }
    </script>
    
    <script>
        let scene, camera, renderer, particles;
        let clock = new THREE.Clock();
        const PARTICLE_COUNT = 50000;
        let currentTemplate = 0;
        const WORLD_SIZE = 5.0; 

        // Hàm khởi tạo Three.js
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            camera.position.z = 10;
            
            loadTextureAndInitParticles();
            animate();

            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('wheel', onMouseScroll, false);
            document.addEventListener('click', onMouseClick, false);
        }

        // 1. Tải Texture
        function loadTextureAndInitParticles() {
            // Sử dụng đường dẫn ảnh công khai. Thay thế bằng ảnh hoa, tim, hoặc bất kỳ hình dạng nào bạn muốn!
            // Texture này nên là một hình ảnh màu trắng/xám trên nền trong suốt (PNG).
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(
                'https://threejs.org/examples/textures/sprites/snowflake1.png', // Ví dụ: Hình bông tuyết
                (texture) => {
                    initParticles(texture);
                },
                undefined,
                (error) => {
                    console.error('Lỗi tải texture:', error);
                    // Khởi tạo mà không có texture nếu cần
                    initParticles(null);
                }
            );
        }

        // --- Logic khởi tạo hạt ---
        function initParticles(texture) {
            const geometry = new THREE.BufferGeometry();
            
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const initialPositions = new Float32Array(PARTICLE_COUNT * 3);
            const customSizes = new Float32Array(PARTICLE_COUNT);
            const customColors = new Float32Array(PARTICLE_COUNT * 3);
            const velocities = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const x = THREE.MathUtils.randFloatSpread(WORLD_SIZE);
                const y = THREE.MathUtils.randFloatSpread(WORLD_SIZE);
                const z = THREE.MathUtils.randFloatSpread(WORLD_SIZE);
                
                positions[i * 3 + 0] = x; initialPositions[i * 3 + 0] = x;
                positions[i * 3 + 1] = y; initialPositions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z; initialPositions[i * 3 + 2] = z;

                velocities[i * 3 + 0] = THREE.MathUtils.randFloatSpread(0.5);
                velocities[i * 3 + 1] = THREE.MathUtils.randFloat(0.5, 1.5);
                velocities[i * 3 + 2] = THREE.MathUtils.randFloatSpread(0.5);

                customSizes[i] = THREE.MathUtils.randFloat(10.0, 30.0); // Kích thước lớn hơn khi dùng texture
                
                customColors[i * 3 + 0] = 1.0; 
                customColors[i * 3 + 1] = THREE.MathUtils.randFloat(0.2, 1.0);
                customColors[i * 3 + 2] = THREE.MathUtils.randFloat(0.2, 1.0);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aInitialPosition', new THREE.BufferAttribute(initialPositions, 3));
            geometry.setAttribute('aSize', new THREE.BufferAttribute(customSizes, 1));
            geometry.setAttribute('aColor', new THREE.BufferAttribute(customColors, 3));
            geometry.setAttribute('aVelocity', new THREE.BufferAttribute(velocities, 3));


            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uHandPosition: { value: new THREE.Vector3(0, 0, 0) },
                    uTime: { value: 0.0 },
                    uTemplate: { value: 0 },
                    uGlobalScale: { value: 1.0 },
                    uColorShift: { value: new THREE.Color(1, 1, 1) },
                    uRepulsionRadius: { value: 2.0 },
                    // 2. Thêm Uniform cho Texture
                    uParticleTexture: { value: texture } 
                },
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                transparent: true,
                depthWrite: false, 
                blending: THREE.AdditiveBlending, 
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }
        
        // Các hàm điều khiển tương tác (giống phiên bản trước)
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function screenToWorld(clientX, clientY) {
            const vector = new THREE.Vector3();
            vector.set((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1, 0.5);
            vector.unproject(camera);
            return vector;
        }

        function onMouseMove(event) {
            const handWorldPosition = screenToWorld(event.clientX, event.clientY);
            particles.material.uniforms.uHandPosition.value.copy(handWorldPosition);
            
            const xNormalized = event.clientX / window.innerWidth;
            const colorR = THREE.MathUtils.lerp(0.5, 1.0, xNormalized);
            const colorG = THREE.MathUtils.lerp(1.0, 0.5, xNormalized);
            particles.material.uniforms.uColorShift.value.setRGB(colorR, colorG, 1.0);
        }

        function onMouseScroll(event) {
            let currentScale = particles.material.uniforms.uGlobalScale.value;
            currentScale -= event.deltaY * 0.001;
            currentScale = Math.max(0.5, Math.min(2.5, currentScale)); 
            particles.material.uniforms.uGlobalScale.value = currentScale;
            
            let currentRadius = particles.material.uniforms.uRepulsionRadius.value;
            currentRadius += event.deltaY * 0.001;
            particles.material.uniforms.uRepulsionRadius.value = Math.max(1.0, Math.min(5.0, currentRadius));
        }

        function onMouseClick() {
            currentTemplate = (currentTemplate + 1) % 3; 
            particles.material.uniforms.uTemplate.value = currentTemplate;
            console.log(`Switched to Template: ${currentTemplate}`);
        }

        // --- Vòng lặp Render ---
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (particles) {
                particles.material.uniforms.uTime.value += delta;
                particles.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
