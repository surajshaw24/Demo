<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhaar Card Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.5.0-beta4/html2canvas.min.js"></script>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        .aadhaar-card { display: none; width: 600px; height: 400px; background: url('file:///C:/Users/rajneesh%20Ray/Pictures/dk.png') no-repeat center; background-size: cover; position: relative; margin: auto; }
        #photoPreview { position: absolute; top: 40px; left: 30px; width: 100px; height: 120px; border-radius: 5px; }
        .info { position: absolute; top: 80px; left: 200px; color: black; font-size: 16px; font-weight: bold; line-height: 0.5; text-align: left; }
        .aadhaar-number { position: absolute; bottom: -100px; left: 550px; font-size: 25px; font-weight: bold; color: black; }
        .print-btn { padding: 10px; background-color: green; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        
        /* Loader Styles */
        .loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.8); z-index: 999; }
        .loader div { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 5px solid #3498db; border-top: 5px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader" id="loader"><div></div></div>
    <div class="container">
        <h2>Aadhaar Card Generator</h2>
        <input type="text" id="nameEnglish" placeholder="Enter Name (English)">
        <input type="date" id="dob">
        <select id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <input type="file" id="photoUpload" accept="image/*" onchange="loadPhoto(event)">
        <button onclick="generateCard()" style="background-color: black; color:white;">Generate Aadhaar</button>
    </div>

    <div class="aadhaar-card" id="aadhaarCard">
        <img id="photoPreview" style="height:160px; width:130px; margin-top:48px; margin-left:20px;" src="">
        <div class="info">
            <p id="displayNameHindi"></p>
            <p id="displayNameEnglish"></p>
            <p id="displayDOB"></p>
            <p id="displayGender"></p>
        </div>
    </div>

    <div class="aadhaar-number" id="displayAadhaar"></div>

    <button class="print-btn" id="printBtn" onclick=" printAadhaar()" style="display: none;">Print Aadhaar Card</button>
    <button class="print-btn" id="downloadBtn" onclick="downloadAadhaar()" style="display: none; background-color: blue;">Download Aadhaar</button>

    <script>
	function printAadhaar() {
    var aadhaarCard = document.getElementById("aadhaarCard");
    var originalContent = document.body.innerHTML;

    // Show only Aadhaar card content
    document.body.innerHTML = aadhaarCard.outerHTML;
    window.print();

    // Restore original content
    document.body.innerHTML = originalContent;
    location.reload(); // Reload to restore event listeners
}

	
        function generateCard() {
            document.getElementById("loader").style.display = "block";
            setTimeout(() => {
                var nameEnglish = document.getElementById("nameEnglish").value.trim(),
                    dob = document.getElementById("dob").value,
                    gender = document.getElementById("gender").value,
                    aadhaar = Array.from({ length: 12 }, () => Math.floor(Math.random() * 10)).join('').replace(/(.{4})/g, '$1 ');

                if (!nameEnglish || !dob || !gender) {
                    document.getElementById("loader").style.display = "none";
                    return alert("Please enter all details!");
                }
                
                var formattedDOB = formatDate(dob);

                translateToHindi(nameEnglish, nameHindi => {
                    translateToHindi(gender, genderHindi => {
                        document.getElementById("displayNameHindi").innerText = nameHindi;
                        document.getElementById("displayNameEnglish").innerText = nameEnglish;
                        document.getElementById("displayDOB").innerText = `जन्म तिथि/DOB: ${formattedDOB}`;
                        document.getElementById("displayGender").innerText = `${genderHindi}/${gender}`;
                        document.getElementById("displayAadhaar").innerText = aadhaar;
                        
                        document.getElementById("aadhaarCard").style.display = "block";
                        document.getElementById("printBtn").style.display = "block";
                        document.getElementById("downloadBtn").style.display = "block";
                        document.getElementById("loader").style.display = "none";
                    });
                });
            }, 2000); // Simulating loading time
        }

        function formatDate(date) {
            if (!date) return "";
            let parts = date.split("-");
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function loadPhoto(event) {
            var reader = new FileReader();
            reader.onload = () => document.getElementById('photoPreview').src = reader.result;
            reader.readAsDataURL(event.target.files[0]);
        }

        function downloadAadhaar() {
            html2canvas(document.getElementById("aadhaarCard"), { scale: 2 }).then(canvas => {
                var link = document.createElement("a");
                link.download = "aadhaar_card.jpg";
                link.href = canvas.toDataURL("image/jpeg");
                link.click();
            });
        }

        function translateToHindi(text, callback) {
            fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=${encodeURIComponent(text)}`)
                .then(response => response.json())
                .then(data => callback(data[0][0][0]))
                .catch(() => callback(text));
        }
    </script>
</body>
</html>
