<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Trading Prediction Game (Demo)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .bet-options {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .bet-btn {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }
        #red {
            background-color: #ff4444;
        }
        #green {
            background-color: #44ff44;
        }
        #violet {
            background-color: #aa44ff;
        }
        .history {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }
        .history-item {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        .red {
            background-color: #ff4444;
        }
        .green {
            background-color: #44ff44;
        }
        .violet {
            background-color: #aa44ff;
        }
        #result {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
        }
        #balance {
            font-size: 20px;
            margin: 10px 0;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 100px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Color Trading Prediction (Demo)</h1>
        <div id="balance">Balance: $1000</div>
        
        <div class="bet-options">
            <button class="bet-btn" id="red">RED (2x)</button>
            <button class="bet-btn" id="green">GREEN (2x)</button>
            <button class="bet-btn" id="violet">VIOLET (3x)</button>
        </div>
        
        <div>
            <label for="betAmount">Bet Amount: $</label>
            <input type="number" id="betAmount" min="1" value="10">
        </div>
        
        <div id="result">Place your bet!</div>
        
        <h3>Prediction History</h3>
        <div class="history" id="history"></div>
    </div>

    <script>
        let balance = 1000;
        const history = [];
        const colors = ["red", "green", "violet"];
        const multipliers = { red: 2, green: 2, violet: 3 };

        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const selectedColor = this.id;
                const betAmount = parseInt(document.getElementById('betAmount').value);
                
                if (betAmount > balance) {
                    alert("Not enough balance!");
                    return;
                }
                
                // Deduct bet amount
                balance -= betAmount;
                document.getElementById('balance').textContent = `Balance: $${balance}`;
                
                // Simulate a random result (can be manipulated in real scams)
                const result = colors[Math.floor(Math.random() * colors.length)];
                history.push(result);
                
                // Update history display
                updateHistory();
                
                // Check if player won
                if (selectedColor === result) {
                    const winAmount = betAmount * multipliers[selectedColor];
                    balance += winAmount;
                    document.getElementById('result').textContent = `You won $${winAmount}! (${result.toUpperCase()})`;
                } else {
                    document.getElementById('result').textContent = `You lost! (${result.toUpperCase()})`;
                }
                
                document.getElementById('balance').textContent = `Balance: $${balance}`;
            });
        });
        
        function updateHistory() {
            const historyDiv = document.getElementById('history');
            historyDiv.innerHTML = '';
            history.slice(-15).forEach(color => {
                const item = document.createElement('div');
                item.className = `history-item ${color}`;
                historyDiv.appendChild(item);
            });
        }
    </script>
</body>
</html>
